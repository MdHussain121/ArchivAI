<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 500px; min-height: 400px; padding: var(--space-md); }
    .options { display: flex; flex-direction: column; gap: var(--space-lg); }
    .form-group { display: flex; flex-direction: column; gap: var(--space-sm); }
    .form-group label { font-weight: 700; text-transform: uppercase; font-size: var(--font-size-sm); }
    .btn-row { display: flex; gap: var(--space-sm); }
    .btn-row .btn { width: auto; flex: 1; }
    .status { margin-top: var(--space-sm); }
    .info-card { background: var(--color-surface); border: 2px solid var(--color-border); padding: var(--space-sm); font-size: var(--font-size-sm); }
    .radio-option { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) 0; cursor: pointer; font-size: var(--font-size-base); }
    .radio-option input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--color-accent); }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header__title">SETTINGS</h1>
      <div class="strip"></div>
    </header>

    <main style="padding: var(--space-md);">
      <div class="options">
        <div class="card">
          <h2 class="card__title">NVIDIA NIM API KEY</h2>
          <div class="info-card">
            Get your API key from <strong>build.nvidia.com</strong>
          </div>
          <div class="form-group" style="margin-top: var(--space-md);">
            <label for="api-key">API Key</label>
            <input type="password" id="api-key" class="input" placeholder="Paste your Nvidia NIM API key" />
          </div>
          <div class="btn-row" style="margin-top: var(--space-md);">
            <button class="btn btn--primary" id="save-key-btn">SAVE KEY</button>
            <button class="btn btn--secondary" id="test-key-btn">TEST KEY</button>
          </div>
          <div id="key-status" class="status" style="display:none"></div>
        </div>

        <div class="card">
          <h2 class="card__title">SUMMARY LENGTH</h2>
          <div class="form-group">
            <label>AI summary detail level:</label>
            <label class="radio-option">
              <input type="radio" name="summary-length" value="short" checked />
              <span>Short — 1-2 sentences</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="summary-length" value="medium" />
              <span>Medium — 1 paragraph (3-5 sentences)</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="summary-length" value="long" />
              <span>Long — detailed multi-paragraph</span>
            </label>
          </div>
        </div>

        <div class="card">
          <h2 class="card__title">ABOUT</h2>
          <p class="card__body">
            ArchivAI v1.0.0<br/>
            Save web pages and auto-organize with Nvidia NIM AI.
          </p>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
